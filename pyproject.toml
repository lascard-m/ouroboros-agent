[project]
name = "ouroboros"
version = "6.2.0"
description = "Self-creating agent"
requires-python = ">=3.10"

dependencies = [
    "openai>=1.0.0",
    "requests",
    "playwright",
    "playwright-stealth",
    "python-dotenv",
    "jiter>=0.8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.setuptools.packages.find]
include = ["ouroboros"]
