name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt || pip install -e . || true
      - name: Syntax check
        run: python -m compileall -q .
      - name: Tests
        if: hashFiles('tests/') != '' || hashFiles('test_*.py') != ''
        continue-on-error: true
        run: pip install pytest && python -m pytest -x -q
